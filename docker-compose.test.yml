services:
  postgres-test:
    image: postgres:18-alpine
    container_name: real-estate-postgres-test
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_DB: realestate_test
    ports:
      - "5434:5432"
    volumes:
      - real_estate_test_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d realestate_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - real_estate_test_network

volumes:
  real_estate_test_postgres_data:

networks:
  real_estate_test_network:
    name: real-estate-test-network
